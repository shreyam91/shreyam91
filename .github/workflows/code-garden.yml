name: 🌱 Generate Code Garden

on:
  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Code Garden
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python code-garden/generate.py

      - name: Commit Code Garden
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add code-garden/garden.svg

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "🌱 Update Code Garden"
            git push
          fi