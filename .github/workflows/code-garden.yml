name: 🌱 Update Code Garden

on:
  workflow_dispatch:

  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  garden:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate garden
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python code-garden/generate.py

      - name: Commit garden
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add code-garden/garden.svg

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "🌱 Update Code Garden"
            git push
          fi